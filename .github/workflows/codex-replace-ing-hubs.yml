name: Codex one-shot replace ING copy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-replace-ing-hubs.yml

permissions:
  contents: write

jobs:
  replace-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace ING copy in homepage
        run: |
          set -euo pipefail
          perl -0pi -e 's/ING Tech Poland/ING Hubs Poland/g' index.html
          if git diff --quiet -- index.html; then
            echo "No replacements needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace ING Tech Poland with ING Hubs Poland"
          git push
